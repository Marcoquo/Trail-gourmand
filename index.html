<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trail Gourmand 2026 — Roadbooks</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0c;
    color: #f0f0f0;
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 28px;
    color: #e8ff3c;
    letter-spacing: 0.5px;
    text-align: center;
    margin-bottom: 4px;
  }
  .sub {
    font-size: 12px;
    color: #666680;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 36px;
  }
  .cards {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 400px;
  }
  a.card {
    display: block;
    text-decoration: none;
    background: #111115;
    border: 1px solid #2a2a35;
    border-radius: 12px;
    padding: 20px 22px;
    transition: border-color 0.2s, background 0.2s;
  }
  a.card:hover { border-color: #e8ff3c; background: #16160e; }
  .day {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #666680;
    margin-bottom: 6px;
  }
  .card-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: #f0f0f0;
    margin-bottom: 10px;
  }
  .card-title span { color: #e8ff3c; }
  .stats {
    display: flex;
    gap: 16px;
  }
  .stat { display: flex; flex-direction: column; }
  .stat-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: #f0f0f0;
    line-height: 1;
  }
  .stat-lbl {
    font-size: 10px;
    color: #666680;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .up { color: #ff4d2e; }
  .arrow {
    float: right;
    font-size: 20px;
    color: #e8ff3c;
    margin-top: -28px;
  }
  .meteo {
    margin-top: 28px;
    background: rgba(88,166,255,0.08);
    border: 1px solid rgba(88,166,255,0.2);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 12px;
    color: #58a6ff;
    text-align: center;
    max-width: 400px;
    width: 100%;
  }
</style>
</head>
<body>
  <div class="title">TRAIL GOURMAND 2026</div>
  <div class="sub">2 × 25 km · 2 500 m D+ · Pays Basque</div>

  <div class="cards">
    <a class="card" href="roadbook-trail-gourmand-j1.html">
      <div class="day">Vendredi 15 mai — Jour 1</div>
      <div class="card-title">Urepel → <span>Baigorri</span></div>
      <div class="stats">
        <div class="stat"><div class="stat-val">26 km</div><div class="stat-lbl">Distance</div></div>
        <div class="stat"><div class="stat-val up">1 191 m</div><div class="stat-lbl">D+</div></div>
        <div class="stat"><div class="stat-val">~4h00</div><div class="stat-lbl">Objectif</div></div>
      </div>
      <div class="arrow">→</div>
    </a>

    <a class="card" href="roadbook-trail-gourmand-j2.html">
      <div class="day">Samedi 16 mai — Jour 2</div>
      <div class="card-title">Urepel → <span>Baigorri</span></div>
      <div class="stats">
        <div class="stat"><div class="stat-val">27.7 km</div><div class="stat-lbl">Distance</div></div>
        <div class="stat"><div class="stat-val up">1 200 m</div><div class="stat-lbl">D+</div></div>
        <div class="stat"><div class="stat-val">~4h00</div><div class="stat-lbl">Objectif</div></div>
      </div>
      <div class="arrow">→</div>
    </a>
  </div>

  <div class="meteo">🌧 Météo pluvieuse prévue · Terrain glissant · Bâtons recommandés</div>
</body>
</html>
